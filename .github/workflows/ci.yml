name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: personal_data_os_test
        ports:
          - 5432:5432
        options: >
          --health-cmd "pg_isready -U ci_user -d personal_data_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true
          cache-dependency-path: api/go.sum

      - name: Verify Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Apply Database Migrations
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h localhost -U ci_user -d personal_data_os_test \
            -f db/migrations/000001_create_sleep_logs.up.sql

      - name: Run Backend Tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: personal_data_os_test
          POSTGRES_SSLMODE: disable
        run: go test -v -race ./...

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.27'
          go-package: ./...
          work-dir: api

      - name: Build Backend Binary
        run: go build -v ./cmd/api

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Verify Formatting (Prettier)
        run: npm run format:check

      - name: Run Vitest Unit Tests
        run: npm test -- --run

      - name: Build Production Bundle
        run: npm run build
